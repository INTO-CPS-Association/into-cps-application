name: Release INTO-CPS App

on:
  push:
    branches:
      - development
      - test-merge-draft
  workflow_dispatch:

jobs:
  release:
    name: Create Draft Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build -- --publish=never

      - name: Semantic Release (Draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx ts-node --esm release.config.ts

      - name: Upload artifacts to Draft Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./release/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}