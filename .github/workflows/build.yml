name: Build INTO-CPS App

on:
  push:
    branches:
      - development
      - snapshot/**
      - gh-actions

  pull_request:
    branches:
      - development
      
jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clean Install
        run: npm run clean
      
      - name: Lint code (non blocking)
        continue-on-error: true
        run: npm run syntax

      - name: Build the app
        run: npm run build -- --publish=never

      - name: Run unit tests (non blocking)
        continue-on-error: true
        run: npm run test:unit

      - name: Install Playwright Browsers
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps

      - name: Install Playwright Browsers (Win/macOS)
        if: runner.os != 'Linux'
        run: npx playwright install

      - name: Run E2E tests (Linux - non blocking)
        continue-on-error: true
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e || echo "E2E tests failed"

      - name: Run E2E tests (Win/macOS - non blocking)
        if: runner.os != 'Linux'
        continue-on-error: true
        run: npm run test:e2e

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.msi
            release/*.zip
            release/*.dmg
          if-no-files-found: ignore
          retention-days: 1